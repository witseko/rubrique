[package]
name = "rubrique"
version = "0.8.7"
edition = "2024"
description = "A fast editor, agentic on demand."
license = "MIT"
homepage = "https://rubrique.dev"
repository = "https://github.com/witseko/rubrique"
publish = false
# Minimum supported Rust (MSRV), matching the README.
rust-version = "1.95"

[dependencies]
# GUI toolkit. Default features trimmed to the OpenGL
# backend (lighter than wgpu), clipboard, link opening, and the Linux backends.
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "clipboard",
    "links",
    "default_fonts",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Native "choose a folder" window for adding explorer folders. On Linux it
# uses the desktop's XDG portal, so no GTK libraries are needed.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Microphone and speakers for voice memos: CoreAudio on macOS, ALSA on Linux
# (which reaches PipeWire and PulseAudio through their ALSA plugins). macOS
# has no built-in command-line recorder, so running one would mean asking
# people to install ffmpeg first. WAV files and resampling are our own code.
cpal = "0.18.2"
# Encrypted scratches and the app PIN: XChaCha20-Poly1305 for the files,
# Argon2id to turn the password into a key and to store the PIN, and zeroize
# to wipe the key from memory on lock. All from the audited RustCrypto set.
chacha20poly1305 = "0.11"
argon2 = { version = "0.6", features = ["zeroize"] }
zeroize = "1"
# Random salts and nonces from the operating system (already used by the
# two crates above; named here so the source is explicit).
getrandom = "0.4"
# "Delete" in the explorer moves local files to the system Trash (macOS
# Finder Trash, the freedesktop.org trash on Linux), so a delete can be undone.
trash = "5.3"

# Lint levels from the Rust guide. `unsafe_code` is `deny` rather than
# `forbid` because date.rs needs one FFI call (`localtime_r`); that single
# use carries a narrow `#[expect(unsafe_code, reason = ...)]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Argon2 (scratch password and PIN) is very slow unoptimized; keep debug
# builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo deb` settings for the Linux .deb package (built by the release workflow).
[package.metadata.deb]
maintainer = "witseko"
section = "editors"
extended-description = "A fast editor, agentic on demand. This version edits Markdown and other text, runs Claude Code, Codex, Grok or a local model, and reviews every change in a merge screen."
assets = [
    ["target/release/rubrique", "usr/bin/", "755"],
    ["packaging/linux/rubrique.desktop", "usr/share/applications/", "644"],
    ["assets/icon/rubrique.svg", "usr/share/icons/hicolor/scalable/apps/rubrique.svg", "644"],
    ["assets/icon/rubrique-64.png", "usr/share/icons/hicolor/64x64/apps/rubrique.png", "644"],
    ["assets/icon/rubrique-128.png", "usr/share/icons/hicolor/128x128/apps/rubrique.png", "644"],
    ["assets/icon/rubrique-256.png", "usr/share/icons/hicolor/256x256/apps/rubrique.png", "644"],
    ["assets/icon/rubrique-512.png", "usr/share/icons/hicolor/512x512/apps/rubrique.png", "644"],
    ["README.md", "usr/share/doc/rubrique/", "644"],
    ["CHANGELOG.md", "usr/share/doc/rubrique/", "644"],
]
