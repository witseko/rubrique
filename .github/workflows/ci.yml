# Checks every push to main and every pull request: formatting, lints,
# tests on Linux and macOS, and a build with the oldest supported Rust.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build libraries
        # A mirror outage on 2026-11-11 hung apt for 21 minutes: retry
        # each download and give up after 10 minutes.
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15, like the release build: macos-latest jobs stopped getting
        # a runner on 2026-11-03 and were cancelled after 15 minutes.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build libraries
        # A mirror outage on 2026-11-11 hung apt for 21 minutes: retry
        # each download and give up after 10 minutes.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  msrv:
    name: Oldest supported Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - name: Install Linux build libraries
        # A mirror outage on 2026-11-11 hung apt for 21 minutes: retry
        # each download and give up after 10 minutes.
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo check --all-targets --locked
