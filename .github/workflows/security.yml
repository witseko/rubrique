# Checks dependencies for known security problems (RustSec advisories),
# licenses and sources with cargo-deny. Runs on dependency changes, on pull
# requests, and every Monday, because new advisories appear for old crates.
name: Security

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/security.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Advisories on their own, so a new advisory does not hide a license problem.
        checks: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The cargo-deny binary comes from its GitHub release through an
      # installer with retries. The EmbarkStudios/cargo-deny-action image
      # downloads it with a bare curl inside a Docker build, which came back
      # as a non-gzip page (rate limit) two runs in a row.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check ${{ matrix.checks }}
