# Builds installable packages for Linux and macOS on every push to main
# (downloadable from the run's artifacts). When Cargo.toml holds a version that
# has no rubrique-vX.Y.Z tag yet, or a rubrique-vX.Y.Z tag is pushed, it also creates that tag
# and a GitHub release with the packages and the CHANGELOG notes. A version with
# a pre-release suffix (1.1.0-rc.1) is published as a GitHub pre-release, which
# never becomes the "latest" release.
name: Release

on:
  push:
    branches: [main]
    tags: ["rubrique-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: Read version and decide whether to release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          release=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "rubrique-v$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
              exit 1
            fi
            release=true
          elif ! git rev-parse -q --verify "refs/tags/rubrique-v$version" > /dev/null; then
            release=true
          fi
          # SemVer: a hyphen after X.Y.Z starts a pre-release suffix (-rc.1).
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "Version $version, release: $release, pre-release: $prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux package
    needs: plan
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build libraries
        # A mirror outage on 2026-11-11 hung apt for 21 minutes: retry
        # each download and give up after 10 minutes.
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          sh packaging/linux/package.sh "${{ needs.plan.outputs.version }}"
          cargo deb --no-build --output dist/
      - uses: actions/upload-artifact@v7
        with:
          name: rubrique-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS app
    needs: plan
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple Silicon and Intel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      # Signing and notarization need the secrets MACOS_CERTIFICATE,
      # MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD.
      # Without them (forks, or before setup) the app is ad-hoc signed: macOS
      # blocks it on first open, and the release notes say how to open it.
      # MACOS_PROVISIONING_PROFILE (a Developer ID profile, base64) lets the
      # app use Touch ID for encrypted scratches; without it that is unavailable.
      - name: Import the Developer ID certificate and provisioning profile
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret: the app is ad-hoc signed and macOS will block it"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/rubrique.provisionprofile"
            echo "MACOS_PROFILE=$RUNNER_TEMP/rubrique.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::warning::No MACOS_PROVISIONING_PROFILE secret: Touch ID for encrypted scratches is unavailable in this build"
          fi
      - name: Bundle, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          sh packaging/macos/bundle.sh "${{ needs.plan.outputs.version }}"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: rubrique-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [plan, linux, macos]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SIGNED: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "- **macOS**: open the .dmg and drag Rubrique to Applications. The app is signed and notarized by Apple."
            else
              echo "- **macOS**: open the .dmg and drag Rubrique to Applications. This version is not notarized yet: the first time, run \`xattr -dr com.apple.quarantine /Applications/Rubrique.app\` in Terminal, or open it and click **Open Anyway** in System Settings → Privacy & Security."
            fi
            echo "- **Debian / Ubuntu**: \`sudo apt install ./rubrique_*.deb\`"
            echo "- **Other Linux**: unpack the .tar.gz and run \`./install.sh\` (installs to ~/.local)."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: rubrique-v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rubrique ${{ needs.plan.outputs.version }}
          body_path: notes.md
          # A release candidate stays off the "latest" spot, so download
          # links to the latest release keep pointing at the stable version.
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
